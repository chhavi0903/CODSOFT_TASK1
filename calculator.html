<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Basic Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .calculator {
            width: 320px;
            background: #222;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        #display {
            width: 100%;
            height: 70px;
            margin-bottom: 15px;
            padding: 10px;
            font-size: 30px;
            text-align: right;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #222;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 60px;
            font-size: 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #444;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background: #666;
        }

        .operator {
            background: #ff9500;
        }

        .operator:hover {
            background: #e68600;
        }

        .clear {
            background: #e74c3c;
        }

        .clear:hover {
            background: #c0392b;
        }

        .equal {
            background: #27ae60;
        }

        .equal:hover {
            background: #219150;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" id="display" value="0" readonly>

        <div class="buttons">

            <button class="clear" id="clear">C</button>
            <button class="operator" data-value="/">÷</button>
            <button class="operator" data-value="*">×</button>
            <button class="operator" data-value="-">−</button>

            <button class="number">7</button>
            <button class="number">8</button>
            <button class="number">9</button>
            <button class="operator" data-value="+">+</button>

            <button class="number">4</button>
            <button class="number">5</button>
            <button class="number">6</button>
            <button class="number">.</button>

            <button class="number">1</button>
            <button class="number">2</button>
            <button class="number">3</button>
            <button class="equal" id="equals">=</button>

            <button class="number">0</button>

        </div>
    </div>

    <script>
        // Get the display element
        const display = document.getElementById("display");

        // Get all number buttons
        const numberButtons = document.querySelectorAll(".number");

        // Get all operator buttons
        const operatorButtons = document.querySelectorAll(".operator");

        // Variables for calculation
        let firstNumber = "";
        let secondNumber = "";
        let operator = "";
        let result = "";

        // Loop through all number buttons
        numberButtons.forEach(function(button) {

            // Event listener for number buttons
            button.addEventListener("click", function() {

                // If display contains 0, replace it
                if (display.value === "0") {
                    display.value = button.textContent;
                } else {
                    display.value += button.textContent;
                }
            });
        });


        // Loop through all operator buttons
        operatorButtons.forEach(function(button) {

            button.addEventListener("click", function() {

                // Store the first number
                firstNumber = display.value;

                // Store the selected operator
                operator = button.getAttribute("data-value");

                // Reset display for second number
                display.value = "0";
            });
        });


        // Equal button
        document.getElementById("equals").addEventListener("click", function() {

            // Store the second number
            secondNumber = display.value;

            // Convert strings to numbers
            let num1 = Number(firstNumber);
            let num2 = Number(secondNumber);

            // Perform calculation using if-else
            if (operator === "+") {
                result = num1 + num2;
            }
            else if (operator === "-") {
                result = num1 - num2;
            }
            else if (operator === "*") {
                result = num1 * num2;
            }
            else if (operator === "/") {

                if (num2 === 0) {
                    result = "Error";
                } else {
                    result = num1 / num2;
                }
            }
            else {
                result = num2;
            }

            // Show result
            display.value = result;
        });


        // Clear button
        document.getElementById("clear").addEventListener("click", function() {

            display.value = "0";
            firstNumber = "";
            secondNumber = "";
            operator = "";
            result = "";
        });
    </script>

</body>
</html>
